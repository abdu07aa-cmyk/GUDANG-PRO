<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Barang Keluar - Gudang Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #f4f6f9; padding: 15px; padding-bottom: 70px; }

        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: #1e293b;
            color: white;
            transition: 0.3s;
            z-index: 1000;
            overflow-y: auto;
        }
        .sidebar.open { left: 0; }
        .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid #334155; }
        .sidebar-header h3 { font-size: 18px; }
        .sidebar-menu { padding: 10px 0; }
        .menu-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: #cbd5e1;
            cursor: pointer;
        }
        .menu-item:hover { background: #334155; color: white; }
        .menu-item .icon { width: 30px; font-size: 20px; }
        .menu-item .text { font-size: 14px; }
        .menu-divider { height: 1px; background: #334155; margin: 10px 20px; }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }
        .overlay.show { display: block; }

        .header {
            background: white;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .menu-toggle {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }
        .logo { font-size: 18px; font-weight: bold; color: #1e293b; }
        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .container { padding: 15px; max-width: 600px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
        input, select, button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; border: 1px solid #ddd; }
        button { background: #f59e0b; color: white; border: none; cursor: pointer; }
        .btn-hapus { background: #dc2626; width: auto; padding: 5px 10px; }
        .alert { padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: 12px; }
        .alert-success { background: #d1fae5; color: #065f46; }
        .alert-error { background: #fee2e2; color: #991b1b; }
        .stok-info { background: #fef3c7; padding: 8px; border-radius: 8px; margin: 10px 0; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; font-size: 12px; }
        @media (max-width: 600px) { th, td { font-size: 10px; } }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header"><h3>📦 GUDANG PRO</h3><p>Manajemen Inventory</p></div>
        <div class="sidebar-menu">
            <div class="menu-item" data-menu="dashboard"><span class="icon">📊</span><span class="text">Dashboard</span></div>
            <div class="menu-item" data-menu="pi-input"><span class="icon">📝</span><span class="text">Input PI</span></div>
            <div class="menu-item" data-menu="stock-in"><span class="icon">📥</span><span class="text">Barang Masuk</span></div>
            <div class="menu-item active" data-menu="stock-out"><span class="icon">📤</span><span class="text">Barang Keluar</span></div>
            <div class="menu-item" data-menu="stock-report"><span class="icon">📋</span><span class="text">Stok Gudang</span></div>
            <div class="menu-divider"></div>
            <div class="menu-item" data-menu="executive"><span class="icon">📈</span><span class="text">Laporan Eksekutif</span></div>
            <div class="menu-divider"></div>
            <div class="menu-item" data-menu="manage-users"><span class="icon">👥</span><span class="text">Kelola User</span></div>
            <div class="menu-item" data-menu="log-aktivitas"><span class="icon">📜</span><span class="text">Log Aktivitas</span></div>
            <div class="menu-divider"></div>
            <div class="menu-item" data-menu="export"><span class="icon">📎</span><span class="text">Export Data</span></div>
            <div class="menu-divider"></div>
            <div class="menu-item" id="logoutMenu"><span class="icon">🚪</span><span class="text">Logout</span></div>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>

    <div class="header">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="logo">📦 GUDANG PRO</div>
        <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>

    <div class="container" id="mainContent">Memuat...</div>

    <script>
        let currentStok = 0;
        let itemList = [];
        
        // Cek session tanpa redirect
        async function cekSession() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) {
                document.getElementById('mainContent').innerHTML = `
                    <div class="card" style="text-align:center">
                        <h3>⚠️ Belum Login</h3>
                        <button onclick="window.location.href='login.html'" style="background:#3b82f6">Ke Login</button>
                    </div>
                `;
                return false;
            }
            return true;
        }
        
        // Ambil daftar PI
        async function loadPiList() {
            const { data: headers } = await sb.from('pi_header').select('*').order('created_at', { ascending: false });
            let html = '<option value="">-- Pilih No PI --</option>';
            for (const h of headers || []) {
                html += `<option value="${h.id}">${h.no_pi} - ${h.tanggal}</option>`;
            }
            document.getElementById('pi_select').innerHTML = html;
        }
        
        // Saat PI dipilih
        async function onPiChange() {
            const piId = document.getElementById('pi_select').value;
            if (!piId) {
                document.getElementById('item_select').innerHTML = '<option value="">-- Pilih PI dulu --</option>';
                document.getElementById('stokInfo').innerHTML = '';
                document.getElementById('historyList').innerHTML = '';
                return;
            }
            
            const { data: details } = await sb.from('pi_detail').select('*').eq('pi_id', piId);
            itemList = details || [];
            
            let html = '<option value="">-- Pilih Item --</option>';
            for (const item of itemList) {
                const { data: masuk } = await sb.from('barang_masuk').select('qty').eq('detail_id', item.id);
                const { data: keluar } = await sb.from('barang_keluar').select('qty').eq('detail_id', item.id);
                let totalMasuk = 0, totalKeluar = 0;
                (masuk || []).forEach(m => totalMasuk += m.qty);
                (keluar || []).forEach(k => totalKeluar += k.qty);
                const stok = totalMasuk - totalKeluar;
                html += `<option value="${item.id}" data-stok="${stok}">${item.brand} | ${item.jenis} | ${item.paper || '-'} | ${item.size || '-'} | Stok: ${stok}</option>`;
            }
            document.getElementById('item_select').innerHTML = html;
        }
        
        // Saat item dipilih
        async function onItemChange() {
            const select = document.getElementById('item_select');
            const selected = select.options[select.selectedIndex];
            const stok = parseInt(selected?.getAttribute('data-stok') || 0);
            currentStok = stok;
            document.getElementById('stokInfo').innerHTML = `<div class="stok-info">📊 Stok tersedia: ${stok}</div>`;
            
            const itemId = select.value;
            if (!itemId) return;
            
            const { data: history } = await sb.from('barang_keluar').select('*').eq('detail_id', itemId).order('tanggal', { ascending: false });
            if (!history || history.length === 0) {
                document.getElementById('historyList').innerHTML = '<div class="info-text">Belum ada histori barang keluar</div>';
                return;
            }
            
            let html = '<div class="table-wrapper"><table style="width:100%"><thead><tr><th>Tanggal</th><th>Qty</th><th>Keterangan</th><th>Aksi</th></tr></thead><tbody>';
            for (const h of history) {
                html += `<tr>
                    <td>${h.tanggal}</td>
                    <td><b>-${h.qty}</b></td>
                    <td>${h.keterangan || '-'}</td>
                    <td><button class="btn-hapus" onclick="hapusHistory(${h.id})">Hapus</button></td>
                </tr>`;
            }
            html += '</tbody></table></div>';
            document.getElementById('historyList').innerHTML = html;
        }
        
        // Hapus histori
        async function hapusHistory(id) {
            if (confirm('Hapus histori ini?')) {
                await sb.from('barang_keluar').delete().eq('id', id);
                alert('Berhasil dihapus');
                location.reload();
            }
        }
        
        async function simpanKeluar() {
    const piId = document.getElementById('pi_select').value;
    const itemId = document.getElementById('item_select').value;
    const qty = document.getElementById('qty_keluar').value;
    const tanggal = document.getElementById('tanggal_keluar').value;
    const keterangan = document.getElementById('keterangan').value;
    
    if (!itemId || !qty || !tanggal) {
        alert('Pilih item, isi qty dan tanggal!');
        return;
    }
    if (parseInt(qty) <= 0) {
        alert('Qty harus lebih dari 0!');
        return;
    }
    if (parseInt(qty) > currentStok) {
        alert(`Stok tidak cukup! Stok tersedia: ${currentStok}`);
        return;
    }
    
    const { data: { user } } = await sb.auth.getUser();
    const { error } = await sb.from('barang_keluar').insert([{
        detail_id: parseInt(itemId),
        tanggal: tanggal,
        qty: parseInt(qty),
        keterangan: keterangan || '-',
        created_by: user.email
    }]);
    
    if (error) {
        alert('Gagal: ' + error.message);
    } else {
        alert('✅ Barang keluar dicatat!');
        
        // RESET hanya qty dan keterangan, PI tetap terpilih
        document.getElementById('qty_keluar').value = '';
        document.getElementById('keterangan').value = '';
        
        // Refresh stok dan histori tanpa mereset PI
        await onPiChange();  // Refresh daftar item (update stok)
        
        // Set ulang pilihan item ke yang sama
        const itemSelect = document.getElementById('item_select');
        for (let i = 0; i < itemSelect.options.length; i++) {
            if (itemSelect.options[i].value == itemId) {
                itemSelect.selectedIndex = i;
                break;
            }
        }
        await onItemChange();  // Refresh histori
    }
}
        
        // Navigasi
        function goToMenu(menu) {
            const files = {
                dashboard: 'dashboard.html',
                'pi-input': 'pi-input.html',
                'stock-in': 'stock-in.html',
                'stock-out': 'stock-out.html',
                'stock-report': 'stock-report.html',
                executive: 'executive-report.html',
                'manage-users': 'manage-users.html',
                'log-aktivitas': 'log-aktivitas.html',
                export: 'export-final3.html'
            };
            window.location.href = files[menu] || 'dashboard.html';
        }
        
        // Sidebar
        function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
        function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }
        function toggleSidebar() { if (document.getElementById('sidebar').classList.contains('open')) closeSidebar(); else openSidebar(); }
        
        async function logout() { await sb.auth.signOut(); window.location.href = 'login.html'; }
        
   async function init() {
    // TAMBAHKAN INI (pengecekan role)
    const { data: { user } } = await sb.auth.getUser();
    if (user) {
        const { data: profile } = await sb.from('user_profiles').select('role').eq('email', user.email).single();
        if (profile?.role !== 'admin') {
            document.getElementById('mainContent').innerHTML = `
                <div class="card" style="text-align:center; padding:30px">
                    <h3>⛔ Akses Ditolak</h3>
                    <p>Halaman Barang Keluar hanya untuk ADMIN.</p>
                    <button onclick="window.location.href='dashboard.html'">Ke Dashboard</button>
                </div>
            `;
            return;
        }
    }
    // SAMPAI SINI
    
    // Lanjutkan kode yang sudah ada...
  
            const loggedIn = await cekSession();
            if (!loggedIn) return;
            
            document.getElementById('menuToggle').addEventListener('click', toggleSidebar);
            document.getElementById('overlay').addEventListener('click', closeSidebar);
            document.getElementById('logoutBtn').addEventListener('click', logout);
            document.getElementById('logoutMenu').addEventListener('click', logout);
            document.querySelectorAll('.menu-item[data-menu]').forEach(el => {
                el.addEventListener('click', () => goToMenu(el.getAttribute('data-menu')));
            });
            
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('mainContent').innerHTML = `
                <div class="card">
                    <div class="card-title">📤 Barang Keluar</div>
                    <div id="msg"></div>
                    <select id="pi_select" onchange="onPiChange()"><option>Loading...</option></select>
                    <select id="item_select" onchange="onItemChange()"><option>-- Pilih PI dulu --</option></select>
                    <div id="stokInfo"></div>
                    <input type="date" id="tanggal_keluar" value="${today}">
                    <input type="number" id="qty_keluar" placeholder="Jumlah Keluar">
                    <input type="text" id="keterangan" placeholder="Keterangan (opsional)">
                    <button onclick="simpanKeluar()">📤 Simpan Barang Keluar</button>
                </div>
                <div class="card">
                    <div class="card-title">📋 Histori Barang Keluar</div>
                    <div id="historyList">Pilih item terlebih dahulu</div>
                </div>
            `;
            await loadPiList();
        }
        
        window.onPiChange = onPiChange;
        window.onItemChange = onItemChange;
        window.simpanKeluar = simpanKeluar;
        window.hapusHistory = hapusHistory;
        
        init();
    </script>
</body>
</html>
