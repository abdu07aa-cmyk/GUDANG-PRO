<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SUPPLY MATERIAL</title>
    <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <!-- Simpan isi URL sebelum library Supabase membersihkannya -->
    <script>
        window.__initialHash = window.location.hash;
        window.__initialSearch = window.location.search;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h2 { margin-bottom: 10px; color: #1e293b; }
        p { color: #64748b; font-size: 14px; margin-bottom: 10px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .msg { padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; }
        .error { background: #fee2e2; color: #991b1b; }
        .success { background: #d1fae5; color: #065f46; }
        .lupa-link { display: block; margin-top: 14px; font-size: 13px; color: #3b82f6; text-decoration: none; }
        .lupa-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔑 Reset Password</h2>
        <p id="subtitle">Memeriksa link...</p>
        <div id="msg"></div>

        <div id="formBox" style="display:none;">
            <input type="password" id="pw1" placeholder="Password baru (min. 6 karakter)">
            <input type="password" id="pw2" placeholder="Ulangi password baru">
            <button id="btnSimpan" onclick="simpanPasswordBaru()">Simpan Password Baru</button>
        </div>

        <a class="lupa-link" href="login.html">← Kembali ke Login</a>
    </div>

    <script>
        let formShown = false;
        const looksLikeRecovery =
            (window.__initialHash || '').includes('type=recovery') ||
            (window.__initialSearch || '').includes('code=');

        function showMsg(msg, type) {
            document.getElementById('msg').innerHTML = `<div class="msg ${type}">${msg}</div>`;
        }

        function tampilkanForm() {
            if (formShown) return;
            formShown = true;
            document.getElementById('subtitle').textContent = 'Masukkan password baru kamu.';
            document.getElementById('msg').innerHTML = '';
            document.getElementById('formBox').style.display = 'block';
        }

        function linkTidakValid() {
            if (formShown) return;
            document.getElementById('subtitle').textContent = '';
            showMsg('Link reset tidak valid atau sudah kedaluwarsa. Kembali ke halaman login, isi email, lalu klik "Lupa password?" untuk meminta link baru.', 'error');
        }

        async function simpanPasswordBaru() {
            const pw1 = document.getElementById('pw1').value;
            const pw2 = document.getElementById('pw2').value;

            if (pw1.length < 6) { showMsg('Password minimal 6 karakter!', 'error'); return; }
            if (pw1 !== pw2) { showMsg('Konfirmasi password tidak sama!', 'error'); return; }

            const btn = document.getElementById('btnSimpan');
            btn.disabled = true;

            const { error } = await sb.auth.updateUser({ password: pw1 });
            if (error) {
                showMsg('Gagal: ' + error.message, 'error');
                btn.disabled = false;
                return;
            }

            document.getElementById('formBox').style.display = 'none';
            showMsg('✅ Password berhasil diubah. Mengarahkan ke halaman login...', 'success');
            await sb.auth.signOut();
            setTimeout(() => { window.location.href = 'login.html'; }, 1500);
        }

        async function init() {
            sb.auth.onAuthStateChange((event) => {
                if (event === 'PASSWORD_RECOVERY') tampilkanForm();
            });
            const { data: { session } } = await sb.auth.getSession();
            if (session && looksLikeRecovery) tampilkanForm();
            setTimeout(linkTidakValid, 3000);
        }

        window.simpanPasswordBaru = simpanPasswordBaru;
        init();
    </script>
</body>
</html>
