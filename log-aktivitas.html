<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Log Aktivitas - Gudang Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; padding: 15px; padding-bottom: 70px; }
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: #1e293b;
            color: white;
            transition: 0.3s;
            z-index: 1000;
            overflow-y: auto;
        }
        .sidebar.open { left: 0; }
        .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid #334155; background: #0f172a; }
        .sidebar-header h3 { font-size: 18px; }
        .sidebar-header p { font-size: 12px; color: #94a3b8; }
        .sidebar-menu { padding: 10px 0; }
        .menu-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: #cbd5e1;
            cursor: pointer;
        }
        .menu-item:hover { background: #334155; color: white; }
        .menu-item .icon { width: 30px; font-size: 20px; }
        .menu-item .text { font-size: 14px; }
        .menu-divider { height: 1px; background: #334155; margin: 10px 20px; }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }
        .overlay.show { display: block; }

        .header {
            background: white;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .menu-toggle {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 8px;
        }
        .logo { font-size: 18px; font-weight: bold; color: #1e293b; }
        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }

        .container { padding: 15px; max-width: 100%; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 18px; margin-bottom: 15px; }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 15px; color: #1e293b; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 12px; }
        th { background: #f8fafc; color: #64748b; }
        .btn-export { background: #10b981; padding: 8px 16px; border-radius: 8px; color: white; border: none; cursor: pointer; }
        .filter-bar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .filter-bar input, .filter-bar select { padding: 8px; border: 1px solid #ddd; border-radius: 8px; }
        .filter-bar button { padding: 8px 16px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>📦 GUDANG PRO</h3>
            <p>Manajemen Inventory</p>
        </div>
        <div class="sidebar-menu">
            <div class="menu-item" data-menu="dashboard"><span class="icon">📊</span><span class="text">Dashboard</span></div>
            <div class="menu-item" data-menu="pi-input"><span class="icon">📝</span><span class="text">Input PI</span></div>
            <div class="menu-item" data-menu="stock-in"><span class="icon">📥</span><span class="text">Barang Masuk</span></div>
            <div class="menu-item" data-menu="stock-out"><span class="icon">📤</span><span class="text">Barang Keluar</span></div>
            <div class="menu-item" data-menu="stock-report"><span class="icon">📋</span><span class="text">Stok Gudang</span></div>
            <div class="menu-item" data-menu="executive"><span class="icon">📈</span><span class="text">Laporan Eksekutif</span></div>
            <div class="menu-divider"></div>
            <div class="menu-item menu-admin-only" data-menu="manage-users"><span class="icon">👥</span><span class="text">Kelola User</span></div>
            <div class="menu-item menu-admin-only active" data-menu="log-aktivitas"><span class="icon">📜</span><span class="text">Log Aktivitas</span></div>
            <div class="menu-divider"></div>
            <div class="menu-item" data-menu="export"><span class="icon">📎</span><span class="text">Export Data</span></div>
            <div class="menu-divider"></div>
            <div class="menu-item" id="logoutMenu"><span class="icon">🚪</span><span class="text">Logout</span></div>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>

    <div class="header">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="logo">📦 GUDANG PRO</div>
        <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>

    <div class="container">
        <div class="card">
            <div class="card-title">
                <span>📜 LOG AKTIVITAS</span>
                <button class="btn-export" onclick="exportToExcel()">📎 Export Excel</button>
            </div>
            <div class="filter-bar">
                <input type="text" id="searchInput" placeholder="Cari user atau aksi..." onkeyup="filterTable()">
                <select id="roleFilter" onchange="filterTable()">
                    <option value="all">Semua Role</option>
                    <option value="admin">Admin</option>
                    <option value="operator">Operator</option>
                </select>
                <button onclick="resetFilter()">Reset</button>
            </div>
            <div class="table-wrapper">
                <div id="logList">Memuat...</div>
            </div>
        </div>
    </div>

    <script>
        let allLogs = [];
        let currentFiltered = [];

        async function loadLogs() {
            const container = document.getElementById('logList');
            container.innerHTML = 'Loading...';
            
            const { data: logs } = await sb.from('log_aktivitas').select('*').order('created_at', { ascending: false });
            allLogs = logs || [];
            currentFiltered = [...allLogs];
            renderTable();
        }
        
        function renderTable() {
            let html = '<table><thead><tr><th>Waktu</th><th>User</th><th>Role</th><th>Aksi</th><th>Detail</th></tr></thead><tbody>';
            for (const log of currentFiltered) {
                const waktu = new Date(log.created_at).toLocaleString('id-ID');
                const roleClass = log.user_role === 'admin' ? 'role-admin' : 'role-operator';
                html += `
                    <tr>
                        <td style="white-space:nowrap">${waktu}</td>
                        <td>${log.user_email}</td>
                        <td class="${roleClass}">${log.user_role?.toUpperCase() || '-'}</td>
                        <td>${log.aksi}</td>
                        <td>${log.detail}</td>
                    </tr>
                `;
            }
            if (currentFiltered.length === 0) {
                html += '<tr><td colspan="5">Belum ada aktivitas</td></tr>';
            }
            html += '</tbody></table>';
            document.getElementById('logList').innerHTML = html;
        }
        
        function filterTable() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const roleFilter = document.getElementById('roleFilter').value;
            
            currentFiltered = allLogs.filter(log => {
                const matchSearch = log.user_email.toLowerCase().includes(searchText) ||
                                   log.aksi.toLowerCase().includes(searchText) ||
                                   (log.detail && log.detail.toLowerCase().includes(searchText));
                const matchRole = roleFilter === 'all' || log.user_role === roleFilter;
                return matchSearch && matchRole;
            });
            renderTable();
        }
        
        function resetFilter() {
            document.getElementById('searchInput').value = '';
            document.getElementById('roleFilter').value = 'all';
            currentFiltered = [...allLogs];
            renderTable();
        }
        
        function exportToExcel() {
            if (currentFiltered.length === 0) {
                alert('Tidak ada data untuk diexport!');
                return;
            }
            
            const excelData = [['Waktu', 'User', 'Role', 'Aksi', 'Detail']];
            for (const log of currentFiltered) {
                excelData.push([
                    new Date(log.created_at).toLocaleString('id-ID'),
                    log.user_email,
                    log.user_role?.toUpperCase() || '-',
                    log.aksi,
                    log.detail
                ]);
            }
            
            const ws = XLSX.utils.aoa_to_sheet(excelData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Log Aktivitas');
            XLSX.writeFile(wb, `Log_Aktivitas_${new Date().toISOString().slice(0,10)}.xlsx`);
            alert('✅ Export berhasil!');
        }
        
        function goToMenu(menu) {
            if (menu === 'dashboard') window.location.href = 'dashboard.html';
            else if (menu === 'pi-input') window.location.href = 'pi-input.html';
            else if (menu === 'stock-in') window.location.href = 'stock-in.html';
            else if (menu === 'stock-out') window.location.href = 'stock-out.html';
            else if (menu === 'stock-report') window.location.href = 'stock-report.html';
            else if (menu === 'executive') window.location.href = 'executive-report.html';
            else if (menu === 'manage-users') window.location.href = 'manage-users.html';
            else if (menu === 'log-aktivitas') window.location.href = 'log-aktivitas.html';
            else if (menu === 'export') window.location.href = 'export-final3.html';
        }
        
        function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
        function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }
        function toggleSidebar() { if (document.getElementById('sidebar').classList.contains('open')) closeSidebar(); else openSidebar(); }
        
        async function logout() { await sb.auth.signOut(); window.location.href = 'login.html'; }
        
        async function init() {
            const allowed = await requireRole(['admin']);
            if (!allowed) return;
            
            document.getElementById('menuToggle').addEventListener('click', toggleSidebar);
            document.getElementById('overlay').addEventListener('click', closeSidebar);
            document.getElementById('logoutBtn').addEventListener('click', logout);
            document.getElementById('logoutMenu').addEventListener('click', logout);
            
            document.querySelectorAll('.menu-item[data-menu]').forEach(item => {
                item.addEventListener('click', () => goToMenu(item.getAttribute('data-menu')));
            });
            
            await loadLogs();
            await filterMenuByRole();
        }
        
        init();
    </script>
</body>
</html>
