<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Supabase</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body>
    <h2>Test Supabase</h2>
    <div id="hasil">Loading...</div>

    <script>
        async function test() {
            const hasil = document.getElementById('hasil');
            hasil.innerHTML = 'Mencoba koneksi ke Supabase...<br>';
            
            try {
                const { data, error } = await sb.from('pi_header').select('count', { count: 'exact', head: true });
                if (error) {
                    hasil.innerHTML += '❌ Error: ' + error.message;
                } else {
                    hasil.innerHTML += '✅ Koneksi ke Supabase BERHASIL!<br>';
                    hasil.innerHTML += 'Jumlah data pi_header: ' + data.count;
                }
            } catch(e) {
                hasil.innerHTML += '❌ Exception: ' + e.message;
            }
        }
        
        test();
    </script>
</body>
</html>
