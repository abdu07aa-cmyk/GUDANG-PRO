<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Kelola User - Gudang Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #f4f6f9; padding: 15px; padding-bottom: 70px; }

        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: #1e293b;
            color: white;
            transition: 0.3s;
            z-index: 1000;
            overflow-y: auto;
        }
        .sidebar.open { left: 0; }
        .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid #334155; }
        .sidebar-header h3 { font-size: 18px; }
        .sidebar-menu { padding: 10px 0; }
        .menu-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: #cbd5e1;
            cursor: pointer;
        }
        .menu-item:hover { background: #334155; color: white; }
        .menu-item .icon { width: 30px; font-size: 20px; }
        .menu-item .text { font-size: 14px; }
        .menu-divider { height: 1px; background: #334155; margin: 10px 20px; }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }
        .overlay.show { display: block; }

        .header {
            background: white;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .menu-toggle {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }
        .logo { font-size: 18px; font-weight: bold; color: #1e293b; }
        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .container { padding: 15px; max-width: 800px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; font-size: 12px; }
        th { background: #f8fafc; }
        select, button { padding: 6px 10px; border-radius: 6px; border: 1px solid #ddd; }
        button { background: #3b82f6; color: white; border: none; cursor: pointer; }
        .btn-refresh { background: #10b981; margin-bottom: 15px; }
        .role-admin { color: #10b981; font-weight: bold; }
        .role-operator { color: #f59e0b; }
        @media (max-width: 600px) { th, td { font-size: 10px; padding: 6px; } }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header"><h3>📦 GUDANG PRO</h3><p>Manajemen Inventory</p></div>
        <div class="sidebar-menu">
            <div class="menu-item" data-menu="dashboard"><span class="icon">📊</span><span class="text">Dashboard</span></div>
            <div class="menu-item" data-menu="pi-input"><span class="icon">📝</span><span class="text">Input PI</span></div>
            <div class="menu-item" data-menu="stock-in"><span class="icon">📥</span><span class="text">Barang Masuk</span></div>
            <div class="menu-item" data-menu="stock-out"><span class="icon">📤</span><span class="text">Barang Keluar</span></div>
            <div class="menu-item" data-menu="stock-report"><span class="icon">📋</span><span class="text">Stok Gudang</span></div>
            <div class="menu-divider"></div>
            <div class="menu-item" data-menu="executive"><span class="icon">📈</span><span class="text">Laporan Eksekutif</span></div>
            <div class="menu-divider"></div>
            <div class="menu-item active" data-menu="manage-users"><span class="icon">👥</span><span class="text">Kelola User</span></div>
            <div class="menu-item" data-menu="log-aktivitas"><span class="icon">📜</span><span class="text">Log Aktivitas</span></div>
            <div class="menu-divider"></div>
            <div class="menu-item" data-menu="export"><span class="icon">📎</span><span class="text">Export Data</span></div>
            <div class="menu-divider"></div>
            <div class="menu-item" id="logoutMenu"><span class="icon">🚪</span><span class="text">Logout</span></div>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>

    <div class="header">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="logo">📦 GUDANG PRO</div>
        <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>

    <div class="container" id="mainContent">Memuat...</div>

    <script>
        // Cek session dan role admin
        async function cekAdmin() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) {
                document.getElementById('mainContent').innerHTML = `
                    <div class="card" style="text-align:center">
                        <h3>⚠️ Belum Login</h3>
                        <button onclick="window.location.href='login.html'" style="background:#3b82f6">Ke Login</button>
                    </div>
                `;
                return false;
            }
            
            // Cek role user
            const role = await getUserRole(session.user.email);
            if (role !== 'admin') {
                document.getElementById('mainContent').innerHTML = `
                    <div class="card" style="text-align:center">
                        <h3>⛔ Akses Ditolak</h3>
                        <p>Halaman ini hanya untuk admin.</p>
                        <button onclick="window.location.href='dashboard.html'" style="background:#3b82f6">Ke Dashboard</button>
                    </div>
                `;
                return false;
            }
            return true;
        }
        
        // Ambil daftar user
        async function loadUsers() {
            const container = document.getElementById('userList');
            container.innerHTML = '<div>Loading...</div>';
            
            // Ambil semua user dari auth (perlu admin)
            const { data: { users }, error } = await sb.auth.admin.listUsers();
            if (error) {
                container.innerHTML = `<div class="alert alert-error">❌ Gagal: ${error.message}</div>`;
                return;
            }
            
            // Ambil role dari user_profiles
            const { data: profiles } = await sb.from('user_profiles').select('*');
            
            let html = '<div class="table-wrapper"><table style="width:100%"><thead><tr><th>Email</th><th>Role</th><th>Aksi</th></tr></thead><tbody>';
            for (const user of users) {
                const profile = profiles?.find(p => p.email === user.email);
                const role = profile?.role || 'operator';
                const roleClass = role === 'admin' ? 'role-admin' : 'role-operator';
                html += `
                    <tr>
                        <td>${user.email}</td>
                        <td class="${roleClass}">${role.toUpperCase()}</td>
                        <td>
                            <select onchange="updateRole('${user.id}', '${user.email}', this.value)">
                                <option value="admin" ${role === 'admin' ? 'selected' : ''}>Admin</option>
                                <option value="operator" ${role === 'operator' ? 'selected' : ''}>Operator</option>
                            </select>
                        </td>
                    </tr>
                `;
            }
            html += '</tbody></table></div>';
            container.innerHTML = html;
        }
        
        // Update role
        async function updateRole(userId, email, newRole) {
            const { error } = await sb.from('user_profiles').upsert({ 
                id: userId, 
                email: email, 
                role: newRole 
            });
            
            if (error) {
                alert('Gagal update role: ' + error.message);
            } else {
                alert(`✅ Role ${email} berhasil diubah menjadi ${newRole.toUpperCase()}`);
                await addLog('UPDATE ROLE', `User ${email} diubah menjadi role ${newRole}`);
                loadUsers();
            }
        }
        
        // Navigasi
        function goToMenu(menu) {
            const files = {
                dashboard: 'dashboard.html',
                'pi-input': 'pi-input.html',
                'stock-in': 'stock-in.html',
                'stock-out': 'stock-out.html',
                'stock-report': 'stock-report.html',
                executive: 'executive-report.html',
                'manage-users': 'manage-users.html',
                'log-aktivitas': 'log-aktivitas.html',
                export: 'export-final3.html'
            };
            window.location.href = files[menu] || 'dashboard.html';
        }
        
        // Sidebar
        function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); }
        function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }
        function toggleSidebar() { if (document.getElementById('sidebar').classList.contains('open')) closeSidebar(); else openSidebar(); }
        
        async function logout() { await sb.auth.signOut(); window.location.href = 'login.html'; }
        
        async function init() {
            const isAdmin = await cekAdmin();
            if (!isAdmin) return;
            
            document.getElementById('menuToggle').addEventListener('click', toggleSidebar);
            document.getElementById('overlay').addEventListener('click', closeSidebar);
            document.getElementById('logoutBtn').addEventListener('click', logout);
            document.getElementById('logoutMenu').addEventListener('click', logout);
            document.querySelectorAll('.menu-item[data-menu]').forEach(el => {
                el.addEventListener('click', () => goToMenu(el.getAttribute('data-menu')));
            });
            
            document.getElementById('mainContent').innerHTML = `
                <div class="card">
                    <div class="card-title">👥 KELOLA USER & AKSES</div>
                    <button class="btn-refresh" onclick="loadUsers()">🔄 Refresh</button>
                    <div id="userList">Memuat...</div>
                </div>
            `;
            await loadUsers();
        }
        
        window.loadUsers = loadUsers;
        window.updateRole = updateRole;
        
        init();
    </script>
</body>
</html>
