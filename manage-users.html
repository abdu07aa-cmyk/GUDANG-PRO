<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola User - Gudang Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        body { font-family: Arial; padding: 20px; background: #f0f2f5; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 15px; max-width: 800px; margin: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        select, button { padding: 5px 10px; border-radius: 5px; }
        button { background: #3b82f6; color: white; border: none; cursor: pointer; }
        .btn-refresh { background: #10b981; margin-bottom: 15px; }
        .btn-back { background: #64748b; margin-top: 20px; width: 100%; padding: 10px; }
        .role-admin { color: green; font-weight: bold; }
        .role-operator { color: orange; }
        .logout-btn { background: #ef4444; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>👥 KELOLA USER & AKSES</h2>
        <button class="btn-refresh" onclick="loadUsers()">🔄 Refresh</button>
        <div id="userList">Memuat...</div>
        <button class="btn-back" onclick="window.location.href='dashboard.html'">⬅ Kembali ke Dashboard</button>
        <button class="logout-btn" onclick="forceLogout()">🚪 Logout Paksa</button>
    </div>

    <script>
        let currentUserRole = null;
        
        async function cekAkses() {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) {
                document.getElementById('userList').innerHTML = '<div style="color:red">❌ Belum login. <a href="login.html">Login</a></div>';
                return false;
            }
            
            // Cek role user
            const { data: profile } = await sb.from('user_profiles').select('role').eq('email', session.user.email).single();
            currentUserRole = profile?.role || 'operator';
            
            if (currentUserRole !== 'admin') {
                document.getElementById('userList').innerHTML = '<div style="color:red">⛔ Akses Ditolak! Halaman ini hanya untuk admin.</div>';
                return false;
            }
            return true;
        }
        
        async function loadUsers() {
            const container = document.getElementById('userList');
            container.innerHTML = 'Loading...';
            
            const hasAccess = await cekAkses();
            if (!hasAccess) return;
            
            // Ambil semua user
            const { data: { users }, error } = await sb.auth.admin.listUsers();
            if (error) {
                container.innerHTML = `<div style="color:red">Error: ${error.message}</div>`;
                return;
            }
            
            // Ambil role dari user_profiles
            const { data: profiles } = await sb.from('user_profiles').select('*');
            
            let html = '<table><thead><tr><th>Email</th><th>Role</th><th>Aksi</th></tr></thead><tbody>';
            for (const user of users) {
                const profile = profiles?.find(p => p.email === user.email);
                const role = profile?.role || 'operator';
                const roleClass = role === 'admin' ? 'role-admin' : 'role-operator';
                html += `
                    <tr>
                        <td>${user.email}</td>
                        <td class="${roleClass}">${role.toUpperCase()}</td>
                        <td>
                            <select onchange="updateRole('${user.id}', '${user.email}', this.value)">
                                <option value="admin" ${role === 'admin' ? 'selected' : ''}>Admin</option>
                                <option value="operator" ${role === 'operator' ? 'selected' : ''}>Operator</option>
                            </select>
                        </td>
                    </tr>
                `;
            }
            html += '</tbody></table>';
            container.innerHTML = html;
        }
        
        async function updateRole(userId, email, newRole) {
            const { error } = await sb.from('user_profiles').upsert({ id: userId, email: email, role: newRole });
            if (error) {
                alert('Gagal: ' + error.message);
            } else {
                alert(`✅ Role ${email} diubah menjadi ${newRole.toUpperCase()}`);
                loadUsers();
            }
        }
        
        async function forceLogout() {
            await sb.auth.signOut();
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = 'login.html';
        }
        
        // Jalankan
        loadUsers();
    </script>
</body>
</html>
