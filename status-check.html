<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cek Status</title>
    <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3b82f6">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body>
    <h2>Cek Koneksi Supabase</h2>
    <div id="hasil"></div>

    <script>
        async function cek() {
            const hasil = document.getElementById('hasil');
            hasil.innerHTML = 'Mengecek session...<br>';
            
            const { data: { session }, error } = await sb.auth.getSession();
            if (error) {
                hasil.innerHTML += '❌ Error session: ' + error.message;
                return;
            }
            
            if (session) {
                hasil.innerHTML += '✅ Session aktif!<br>';
                hasil.innerHTML += 'Email: ' + session.user.email + '<br>';
                hasil.innerHTML += '<a href="dashboard.html">Ke Dashboard</a>';
            } else {
                hasil.innerHTML += '❌ Tidak ada session. Silakan login.<br>';
                hasil.innerHTML += '<a href="login.html">Ke Login</a>';
            }
        }
        
        cek();
    </script>
</body>
</html>
