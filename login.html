<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SUPPLY MATERIAL</title>
    <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h2 { margin-bottom: 10px; color: #1e293b; }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        button:active { transform: scale(0.98); }
        .btn-secondary { background: #e2e8f0; color: #1e293b; margin-top: 8px; }
        .msg { padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; }
        .error { background: #fee2e2; color: #991b1b; }
        .success { background: #d1fae5; color: #065f46; }
        .lupa-link { display: block; margin-top: 14px; font-size: 13px; color: #3b82f6; text-decoration: none; cursor: pointer; }
        .lupa-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>📦 SUPPLY MATERIAL</h2>
        <p>Silakan login</p>
        <div id="msg"></div>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <button class="btn-secondary" onclick="register()">Daftar Akun</button>
        <a class="lupa-link" onclick="lupaPassword(); return false;">Lupa password?</a>
    </div>

    <script>
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                showMsg('Isi email dan password!', 'error');
                return;
            }
            
            const { error } = await sb.auth.signInWithPassword({ email, password });
            if (error) {
                showMsg('Login gagal: ' + error.message, 'error');
            } else {
                showMsg('Berhasil! Mengarahkan...', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            }
        }
        
        async function register() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                showMsg('Isi email dan password!', 'error');
                return;
            }
            if (password.length < 6) {
                showMsg('Password minimal 6 karakter!', 'error');
                return;
            }
            
            const { error } = await sb.auth.signUp({ email, password });
            if (error) {
                showMsg('Gagal daftar: ' + error.message, 'error');
            } else {
                showMsg('Pendaftaran berhasil! Silakan login.', 'success');
            }
        }
        
        async function lupaPassword() {
            const email = document.getElementById('email').value.trim();
            if (!email) {
                showMsg('Isi dulu alamat email di kolom Email, lalu klik "Lupa password?"', 'error', 5000);
                return;
            }
            const redirectTo = new URL('reset-password.html', window.location.href).href;
            const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });
            if (error) {
                showMsg('Gagal mengirim email: ' + error.message, 'error', 6000);
            } else {
                showMsg('Jika email terdaftar, link reset password sudah dikirim. Cek inbox atau folder spam.', 'success', 8000);
            }
        }

        function showMsg(msg, type, ms) {
            const div = document.getElementById('msg');
            div.innerHTML = `<div class="msg ${type}">${msg}</div>`;
            setTimeout(() => div.innerHTML = '', ms || 3000);
        }
    </script>
</body>
</html>
