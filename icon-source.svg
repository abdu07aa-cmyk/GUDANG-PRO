<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Background: rounded square, iOS/Android app-icon style -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)"/>

  <!-- subtle inner glow -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)"/>
  <circle cx="180" cy="140" r="180" fill="#ffffff" opacity="0.06"/>

  <!-- 3D Box / Package icon representing inventory -->
  <g>
    <!-- left face -->
    <polygon points="166,206 256,256 256,386 166,336" fill="url(#leftFace)"/>
    <!-- right face -->
    <polygon points="256,256 346,206 346,336 256,386" fill="url(#rightFace)"/>
    <!-- top face -->
    <polygon points="166,206 256,156 346,206 256,256" fill="url(#topFace)"/>

    <!-- edge lines for definition -->
    <polygon points="166,206 256,156 346,206 256,256" fill="none" stroke="#1e293b" stroke-opacity="0.12" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="166,206 256,256 256,386 166,336" fill="none" stroke="#1e293b" stroke-opacity="0.12" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="256,256 346,206 346,336 256,386" fill="none" stroke="#1e293b" stroke-opacity="0.12" stroke-width="4" stroke-linejoin="round"/>

    <!-- tape / seam accent lines on top face -->
    <line x1="256" y1="156" x2="256" y2="256" stroke="#94a3b8" stroke-width="3" stroke-opacity="0.4"/>

    <!-- box tape accent (brand color) on right face -->
    <line x1="256" y1="256" x2="346" y2="206" stroke="#3b82f6" stroke-width="6" stroke-opacity="0.25"/>
    <line x1="256" y1="386" x2="256" y2="256" stroke="#8b5cf6" stroke-width="6" stroke-opacity="0.18"/>
  </g>
</svg>
