<!DOCTYPE html>
<html>
<head>
    <title>Test Search</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body>
    <h2>Test Data</h2>
    <div id="hasil"></div>

    <script>
        async function test() {
            const { data: details } = await sb.from('pi_detail').select('brand, jenis, paper');
            let html = '<ul>';
            for (const d of details) {
                html += '<li>Brand: ' + d.brand + ' | Jenis: ' + d.jenis + ' | Paper: ' + d.paper + '</li>';
            }
            html += '</ul>';
            document.getElementById('hasil').innerHTML = html;
        }
        test();
    </script>
</body>
</html>
