<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <title>Dashboard - Gudang Pro</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;

            background: white;

            padding: 20px;

            max-width: 600px;
            margin: 20px auto;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);

        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;

            margin: 10px;

    <div class="card">

        <button onclick="window.location.href='login.html'" class="btn-logout">🚪 Logout</button>
        <button onclick="window.location.href='stock-in.html'">📥 Barang Masuk</button>
        <button onclick="window.location.href='stock-out.html'">📤 Barang Keluar</button>
